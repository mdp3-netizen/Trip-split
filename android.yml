name: Build Android app

# Runs every time you push to GitHub, or when you press "Run workflow" on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project (first time only)
        run: '[ -d android ] || npx cap add android'

      - name: Make app icons and splash screens
        run: npm run icons -- --android

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Set version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build test APK (install this on your phone)
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: trip-kitty-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Play Store file. Only runs after you add the 4 signing secrets (see README).
      - name: Build signed Play Store bundle
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v6
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          name: trip-kitty-play-store-aab
          path: android/app/build/outputs/bundle/release/*.aab
